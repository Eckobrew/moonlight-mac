name: macOS build and tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Toolchain
        run: |
          swift --version
          python3 --version
      - name: Regression tests
        run: swift test --jobs 4
      - name: Vulkan runtime packaging tests
        run: python3 -B Tests/Packaging/test_vulkan_bundle.py
      - name: Release package and verification
        run: ./Scripts/package_app.sh release
