name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Release DMG
    runs-on: macos-15

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Select Xcode 16
        run: |
          if [ -d "/Applications/Xcode_16.0.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.0.app
          elif [ -d "/Applications/Xcode_16.1.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.1.app
          elif [ -d "/Applications/Xcode_16.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.app
          fi
          swift --version

      - name: Package Release Application
        run: |
          chmod +x Scripts/package_app.sh
          ./Scripts/package_app.sh

      - name: Create DMG
        run: |
          mkdir -p dist
          npx create-dmg "Products/Moonlight.app" dist --overwrite --no-code-sign || {
            echo "create-dmg encountered an issue, generating DMG with hdiutil fallback..."
            hdiutil create -volname "Moonlight" -srcfolder "Products/Moonlight.app" -ov -format UDZO "dist/Moonlight.dmg"
          }
          ls -la dist/

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.dmg
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
